<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login form</title>

    <style>
      body {
        padding: 0px;
        margin: 0px;
        width: 100vh;
        background-color: #1a1a1a;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .card {
        background-color: #fff;
        border-radius: 8px;
        padding: 10px;
        margin: 10px;
        width: 300px;
      }
      h2 {
        color: rgb(34, 34, 177);
        font-weight: bold;
        text-align: center;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      input {
        padding: 10px;
        /* margin: 10px; */
        border-radius: 5px;
        border: 1px solid rgb(34, 34, 177);
      }
      button{
        padding: 10px;
        border-radius: 5px;
        background-color: rgb(34, 34, 177);
        color: #fff;
        font-weight: bold;
        font-size: 14px;
        
      }
      button:hover{
        background-color: beige;
        color: #1a1a1a;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Login</h2>
      <form action="">
        <input type="text" name="" placeholder="Enter Username" />
        <input type="password" name="" placeholder="Enter Passwword" id="" />
        <button type="submit">Login</button>
      </form>
    </div>
  </body>
</html>
