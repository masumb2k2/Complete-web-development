<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      body {
        background-color: #1a1a1a;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, Helvetica, sans-serif;
      }
      .card {
        background-color: #d4d4d4;
        border-radius: 8px;
        padding: 30px;
        width: 300px;
      }
      h2 {
        color: #1a50a0;
        text-align: center;
        margin-bottom: 20px;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 30px;
      }
      input{
        margin-bottom: 15px;
        padding: 10px;
        border-radius: 5px;
        background-color: #efefef;
        border: 1px solid #1a50a0 ;
      }
      button{
        background-color: #1a50a0;
        color: #fff;
        padding: 10px;
        border-radius: 5px;
        font-weight: bold;
      }
      button:hover{
        background-color: #252424;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>LogIn</h2>
      <form action="">
        <input type="text" name="uname" placeholder="Enter Username" />
        <input
          type="password"
          name="pass"
          placeholder="Enter Passwword"
          id=""
        />
        <button type="submit">Login</button>
      </form>
    </div>
  </body>
</html>
