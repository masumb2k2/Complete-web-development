      <nav id="navigatio">

    <main>
      <section id="about">
        <h2>Contact Us</h2>
        <div id="form">
          <form action="">
            <div>
              <label for="name">
                Name: <input type="text" name="name" id="" />
              </label>
            </div>
            <div class="email">
              <label for="email">
                Email: <input type="email" name="email" id="" />
              </label>
            </div>
            <div class="phone">
                <label for="phone">
                    Phone: <input type="tel" name="phone" id="">
                </label>
            </div>
            <div class="dob">
                <label for="dob">
                    Date of Birth: <input type="date" name="dob" id="">
                </label>
            </div>
            <div class="gender">
                <label for="gender">
                    Gender: 
                    <input type="radio" name="gender" value="Male" id=""> Male
                    <input type="radio" name="gender" value="Female" id=""> Female
                </label>
            </div>
          </form>
        </div>
      </section>
    </main>
